apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runbook-hunter.fullname" . }}-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "runbook-hunter.name" . }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "runbook-hunter.name" . }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "runbook-hunter.serviceAccountName" . }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--mode=worker", "--config=/app/config/config.yaml"]
          envFrom:
            - secretRef:
                name: {{ include "runbook-hunter.fullname" . }}-secret
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: runbooks
              mountPath: /runbooks
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "runbook-hunter.fullname" . }}-config
        - name: runbooks
          configMap:
            name: {{ include "runbook-hunter.fullname" . }}-runbooks
