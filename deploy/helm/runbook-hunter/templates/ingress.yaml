{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "runbook-hunter.fullname" . }}
  annotations:
{{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
{{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "runbook-hunter.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: {{ include "runbook-hunter.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: {{ include "runbook-hunter.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: {{ include "runbook-hunter.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "runbook-hunter.fullname" . }}-ui
                port:
                  number: {{ .Values.ui.service.port }}
{{- end }}
