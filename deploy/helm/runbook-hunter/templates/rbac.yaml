apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "runbook-hunter.fullname" . }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "runbook-hunter.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "runbook-hunter.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "runbook-hunter.fullname" . }}
