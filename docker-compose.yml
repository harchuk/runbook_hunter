version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: runbook_hunter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--mode=api", "--config=/app/config/config.yaml"]
    ports:
      - "8080:8080"
    environment:
      RH_AUTH_BASIC_USER: admin
      RH_AUTH_BASIC_PASS: change-me
      RH_SETTINGS_CRYPTO_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    volumes:
      - ./examples/local/config.yaml:/app/config/config.yaml:ro
      - ./runbooks:/runbooks:ro
    depends_on:
      - postgres

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--mode=worker", "--config=/app/config/config.yaml"]
    environment:
      RH_AUTH_BASIC_USER: admin
      RH_AUTH_BASIC_PASS: change-me
      RH_SETTINGS_CRYPTO_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    volumes:
      - ./examples/local/config.yaml:/app/config/config.yaml:ro
      - ./runbooks:/runbooks:ro
    depends_on:
      - postgres

  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8080

volumes:
  pgdata:
