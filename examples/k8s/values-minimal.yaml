image:
  repository: ghcr.io/example/runbook-hunter-backend
  tag: latest

uiImage:
  repository: ghcr.io/example/runbook-hunter-ui
  tag: latest

ingress:
  enabled: true
  className: nginx
  host: runbook-hunter.local

auth:
  mode: basic
  basicUser: admin
  basicPass: change-me
  oidc:
    issuerUrl: https://keycloak.example.com/realms/runbook
    clientId: runbook-hunter
    groupsClaim: groups
    usernameClaim: preferred_username
    adminGroups:
      - runbook-admins
    allowBasicFallback: true

secrets:
  settingsCryptoKey: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="

config:
  database:
    driver: postgres
    dsn: postgres://postgres:postgres@postgres.default.svc.cluster.local:5432/runbook_hunter?sslmode=disable
  auth:
    mode: basic
    basicUser: admin
    basicPass: change-me
    oidc:
      issuerUrl: https://keycloak.example.com/realms/runbook
      clientId: runbook-hunter
      groupsClaim: groups
      usernameClaim: preferred_username
      adminGroups:
        - runbook-admins
      allowBasicFallback: true
  runbooks:
    mode: file
    path: /runbooks
  destinations:
    telegram:
      - id: tg-default
        name: Telegram primary
        enabled: true
        botToken: "${TELEGRAM_BOT_TOKEN}"
        chatId: "-100123456789"
        topicId: 0
  routing:
    rules:
      - name: critical-to-telegram
        routeKey: critical
        enabled: true
        priority: 10
        matchLabels:
          severity: critical
        destinations:
          - tg-default
  closure:
    policy: auto+manual
    autoCloseConsecutive: 2
  gitops:
    enabled: true
    mode: strict
    repoUrl: https://github.com/harchuk/runbook_hunter
    baseBranch: main
    basePath: .
    commitSignoff: true
    provider: github
    tokenSecretRef: runbook-hunter-gitops-token
  awx:
    enabled: false
    url: ""
    requestTimeout: 20s
    defaultInventoryId: 0
  access:
    groupRules:
      - group: noc-prod
        services: [api, db]
        envs: [prod]
        severities: [critical, warning]
