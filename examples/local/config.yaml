server:
  addr: ":8080"
  readTimeout: 10s
  writeTimeout: 30s
worker:
  interval: 30s
  batchSize: 20
  maxConcurrency: 4
database:
  driver: postgres
  dsn: postgres://postgres:postgres@postgres:5432/runbook_hunter?sslmode=disable
auth:
  mode: basic
  basicUser: admin
  basicPass: change-me
  jwtSecret: change-me
  oidc:
    issuerUrl: http://keycloak:8080/realms/runbook
    clientId: runbook-hunter
    groupsClaim: groups
    usernameClaim: preferred_username
    adminGroups:
      - runbook-admins
    allowBasicFallback: true
security:
  egressAllowlist:
    - localhost
    - 127.0.0.1
    - api
    - postgres
    - '*.svc.cluster.local'
  requestTimeout: 5s
  retryCount: 2
  circuitBreakerFails: 3
  circuitBreakerWindow: 1m
runbooks:
  mode: file
  path: /runbooks
fingerprint:
  fields:
    - alertname
    - service
    - env
    - instance|job
limits:
  stepTimeout: 5s
  dedupCooldown: 5m
  maxSteps: 3
sources:
  alertmanager:
    - name: default
      receiver: default
      enabled: true
destinations:
  telegram: []
  mattermost: []
routing:
  rules: []
closure:
  policy: auto+manual
  autoCloseConsecutive: 2
gitops:
  enabled: true
  mode: hybrid
  repoUrl: https://github.com/harchuk/runbook_hunter
  baseBranch: main
  basePath: .
  commitSignoff: true
  provider: github
  tokenSecretRef: runbook-hunter-gitops-token
awx:
  enabled: false
  url: ""
  requestTimeout: 20s
  defaultInventoryId: 0
access:
  groupRules:
    - group: noc-prod
      services: [api, db]
      envs: [prod]
      severities: [critical, warning]
