schemaVersion: v2
name: Demo API 5xx spike (local)
description: Local docker-compose demo runbook with reachable read-only checks.
match:
  alertname: DemoAPI5xxSpike
steps:
  - name: API health endpoint
    kind: check
    tool: http_get
    required: true
    timeout: 4s
    retries: 1
    recommendation_on_fail: Validate API container health endpoint.
    recommendation_on_pass: Health endpoint returns 200.
    args:
      url: http://api:8080/healthz
  - name: API readiness JSON
    kind: check
    tool: fetch_json
    required: true
    timeout: 4s
    retries: 1
    recommendation_on_fail: Check DB readiness and migrations.
    recommendation_on_pass: API is ready.
    args:
      url: http://api:8080/readyz
  - name: API DNS resolution
    kind: check
    tool: dns_lookup
    required: false
    timeout: 4s
    retries: 1
    recommendation_on_fail: Investigate Docker network alias resolution.
    recommendation_on_pass: DNS lookup successful.
    args:
      host: api
